name: Auto Translate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


jobs:
  convert:
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert TESTING
        run: |
          find docs-en -type f -name "*.fodt" | while read file; do
            echo "Converting $file"
            #outdir="$(dirname "$file")"
            echo dirname
            #mkdir -p "$outdir"
            mkdir -p "docs-en/odt/"
            cp "$file" "$outdir"
          done


      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice


      - name: Convert FODT files to ODT
        run: |
          find docs-en -type f -name "*.fodt" | while read file; do
            echo "Converting $file"
            outdir="$(dirname "$file")"
            mkdir -p "$outdir"
            timeout 60s libreoffice --headless --convert-to odt "$file" --outdir "$outdir"
          done


      - name: Sync Crowdin files
        uses: crowdin/github-action@v1
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          crowdin_branch_name: main
          localization_branch_name: fr-FR
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.CROWDIN_GITHUB_TOKEN }}
         
      - name: Create or Update LibreOffice Config
        run: |
          # Define the trusted directory
          cat ~/.config/libreoffice/4/user/registrymodifications.xcu
          pwd
          
          # Create the LibreOffice user profile directory if it doesn't exist
          mkdir -p ~/.config/libreoffice/4/user/  # Adjust '4' if using a different major version
          cp -f $GITHUB_WORKSPACE/config/registrymodifications.xcu ~/.config/libreoffice/4/user          
          cat ~/.config/libreoffice/4/user/registrymodifications.xcu


      - name: Install libreoffice macros
        run: |
          mkdir -p ~/.config/libreoffice/4/user/basic/Standard
          cp macros/Module1.xba ~/.config/libreoffice/4/user/basic/Standard/Module1.xba
          cp macros/script.xlb ~/.config/libreoffice/4/user/basic/Standard/script.xlb

          
      - name: Update all FODT file links
        run: |
          find docs-en docs-fr -type f -name "*.fodt" | while read file; do
            echo "Updating links in $file"
            timeout 60s libreoffice --headless --invisible "macro:///Standard.Module1.SaveAndExitDocument" "$file"
          done

          
      - name: Convert FODT files to PDF
        run: |
          find docs-en docs-fr -type f -name "*.fodt" | while read file; do
            echo "Converting $file"
            #outdir="$(dirname "$file")"
            #mkdir -p "$outdir"
            timeout 60s libreoffice --headless --convert-to pdf "$file" --outdir "$outdir"
          done

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-pdfs
          path: docs-en/pdf

          
      - name: Commit and push (git)
        run: | 
          sudo chown -R "$USER" .git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: add generated files [skip ci]"
          git push --set-upstream origin fr-FR

